# Total War: WARHAMMER II — known public builds.
#
# Same rules as 364360-warhammer.toml: one [[versions]] entry per build; each
# depot's manifest is the newest one dated at or before the build.

game = "Total War: WARHAMMER II"
short = "wh2"
app_id = 594570
exe = "Warhammer2.exe"
folder = "Total War Warhammer II"
user_folder = '%APPDATA%\The Creative Assembly\Warhammer2'
modified_log = '%APPDATA%\The Creative Assembly\Warhammer2\logs\modified.log'

# Names below are from SteamDB (base) or from the pack names inside each
# depot (DLC). The DLC depots are Mortal Empires tie-ins for owners of WH1 and
# its DLC: tiny audio/data packs or empty "EmptySteamDepot" markers, with the
# real content in the base packs, unlocked by ownership. TODO: replace the
# guessed/unknown DLC names with SteamDB's.
[depots]
594571 = "exe_win"
594572 = "data"
594573 = "english"
617811 = "data_2"            # Great Vortex startpos.esf; base game, not DLC
594590 = "DLC: ? (empty marker, manifest 2017-03-16)"
594591 = "DLC: ? (empty marker, manifest 2017-06-28)"
594592 = "DLC: Beastmen? (audio_bm, data_bm)"
594593 = "DLC: ? (audio_lu)"
594594 = "DLC: ? (audio_lu2)"
594597 = "DLC: Wood Elves? (audio_we, data_we)"
594598 = "DLC: Bretonnia? (audio_br)"
594600 = "DLC: ? (empty marker, manifest 2017-02-24)"
594601 = "DLC: ? (empty marker, manifest 2017-02-24)"
617810 = "DLC: ? (empty marker, manifest 2017-05-02)"


