# Total War: WARHAMMER — known public builds.
#
# Each [[versions]] entry is one build. For a build at time T, every depot's
# manifest is the newest one dated at or before T; depots a patch didn't touch
# keep an older manifest. Manifest IDs are quoted (they're too big for TOML
# integers). See README.md, "Adding a version to the catalog".

game = "Total War: WARHAMMER"
short = "wh1"
app_id = 364360
exe = "Warhammer.exe"
folder = "Total War Warhammer"
user_folder = '%APPDATA%\The Creative Assembly\Warhammer'
modified_log = '%APPDATA%\The Creative Assembly\Warhammer\logs\modified.log'

[depots]
364361 = "Executables"
364362 = "Data"
364363 = "English text (includes DLC text packs)"
404010 = "DLC: Chaos Warriors"
404011 = "DLC: Blood for the Blood God"
404012 = "DLC: Call of the Beastmen"
404013 = "DLC: The Grim and the Grave"   # empty marker depot; content is in the base packs


